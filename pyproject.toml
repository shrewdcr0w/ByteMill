[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bytemill"
version = "0.1.0"
description = "Local-first data cleaning engine with UI and CLI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "flask>=3.0.0",
    "chardet>=5.2.0",
    "pyarrow>=14.0.0"
]

[project.scripts]
bytemill = "bytemill.interfaces.cli.main:cli_main"

[tool.setuptools.packages.find]
where = ["src"]