name: Build ByteMill Executables

on:
  workflow_dispatch: 
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Build with PyInstaller (Mac/Linux)
      if: runner.os != 'Windows'
      run: pyinstaller --name "ByteMill-${{ matrix.os }}" --onefile --add-data "src/bytemill/interfaces/web:src/bytemill/interfaces/web" src/bytemill/interfaces/api/app.py

    - name: Build with PyInstaller (Windows)
      if: runner.os == 'Windows'
      run: pyinstaller --name "ByteMill-${{ matrix.os }}" --onefile --add-data "src/bytemill/interfaces/web;src/bytemill/interfaces/web" src/bytemill/interfaces/api/app.py
      
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ByteMill-${{ matrix.os }}
        path: dist/*